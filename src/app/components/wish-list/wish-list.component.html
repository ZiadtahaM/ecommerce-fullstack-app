<div>
    <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
      <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
        <tr>
          <th scope="col" class="px-16 py-3">
            <span class="sr-only">Image</span>
          </th>
          <th scope="col" class="px-6 py-3">
            Product
          </th>
          <th scope="col" class="px-6 py-3">
            Qty
          </th>
          <th scope="col" class="px-6 py-3">
            Price
          </th>
          <th scope="col" class="px-6 py-3">
            Action
          </th>
        </tr>
      </thead>
      <tbody>
        @for (item of wishLIst; track item._id ) {
          <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
            <td class="p-4">
              <img [src]="item.imageCover" class="w-16 md:w-32 max-w-full max-h-full" [alt]="item.title">
            </td>
            <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
              {{item.title }}
            </td>
            <td class="px-6 py-4">
              <div class="flex items-center">
        
                
             
              </div>
            </td>
         
            <td class="px-6 py-4">
              <button (click)="removeWish(item._id)" class="font-medium text-red-600 dark:text-red-500 hover:underline">Remove</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
 
</div>
