<section class="my-2">

      <ng-template carouselSlide>
        <img [src]="cat.image" class="w-full p-2 overflow-hidden h-48 md:h-64 lg:h-80 object-cover rounded-lg" [alt]="cat.name">
      </ng-template>
    }
  </owl-carousel-o>
</section>

<section class="container mx-auto">
  <div class="row flex flex-wrap justify-center">
    @for (product of productlist.slice(0,16) |searching:searchQuery; track product.id) {
      <div class="min-h-20 md:w-1/2 lg:w-1/3 xl:w-1/6 p-2">
        <div class="border-2 border-teal-400 " >
         <div [routerLink]="['/details' , product.id]"> <img [src]="product.imageCover" alt="" class="w-fit">
          <h3 class="text-sm">{{product.category.name}}</h3>
          <h4 class="text-xs">{{product.title.split("",2).join("")}}</h4>

          <div class="flex justify-between items-center">
            <span>{{product.price}}$</span>

            <div>
              <span class="text-yellow-300"><i class="fas fa-star"></i></span>
              <span>{{product.ratingsAverage}}</span>
            </div>
          </div></div>
          <!-- Add hover effect to show the button -->
           <div class="flex justify-between items-center  ">
            <button (click)="addtocart(product.id)" type="button" class="text-white  bg-green-700 hover:bg-green-800 focus:outline-none focus:ring-4 focus:ring-green-300 font-medium rounded-full text-sm px-5 py-2.5 text-center me-2 mb-2 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800 opacity-0 hover:opacity-100 transition duration-300">
              Add to Cart
            </button>

            <i (click)="addWish(product.id)" class="fa-solid fa-heart p-1 text-xl hover:text-red-400"></i>
            
           </div>



         
        </div>
      </div>
    }
  </div>
</section>
